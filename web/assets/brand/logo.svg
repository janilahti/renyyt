<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>Renyyt — bin cycle adaptive icon</title>

  <style>
    .cycle-stroke { stroke: #2f7d5a; }
    .cycle-fill { fill: #2f7d5a; }
    .bin { stroke: #3f4a54; }

    @media (prefers-color-scheme: dark) {
      .cycle-stroke { stroke: #69b98f; }
      .cycle-fill { fill: #69b98f; }
      .bin { stroke: #d7dee5; }
    }
  </style>

  <!-- Arc starts extend slightly farther away from the arrow heads. -->
  <path class="cycle-stroke"
        d="M30.5 39.5 A43 43 0 0 1 94 39"
        fill="none"
        stroke-width="8"
        stroke-linecap="butt"/>

  <path class="cycle-fill"
        d="M79.5 35.5 L97 44.5 L80.5 54.5 Z"
        transform="translate(3 -4) rotate(180 88.25 45)"/>

  <path class="cycle-stroke"
        d="M97.5 88.5 A43 43 0 0 1 34 89"
        fill="none"
        stroke-width="8"
        stroke-linecap="butt"/>

  <path class="cycle-fill"
        d="M48.5 92.5 L31 83.5 L47.5 73.5 Z"
        transform="translate(-3 4) rotate(180 39.75 83)"/>

  <!-- Bin moved subtly downward as a complete unit. -->
  <g class="bin"
     fill="none"
     stroke-width="7"
     stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M45 49 H83"/>
    <path d="M51 49 L55 89 H73 L77 49"/>
    <path d="M56 41 H72"/>
  </g>
</svg>
