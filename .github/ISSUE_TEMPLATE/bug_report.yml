name: Bug report
description: Report a reproducible problem
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Start server...\n2. Open...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of /version or the VERSION file.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, browser, OS, reverse proxy/container if relevant. Do not include credentials or customer data.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials, customer numbers and personal data before posting.
