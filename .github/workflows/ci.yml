name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      browser: ${{ steps.changes.outputs.browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether browser tests are needed
        id: changes
        run: python3 scripts/ci_browser_changes.py >> "$GITHUB_OUTPUT"

  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Python compile check
        run: python -m compileall -q src scripts run.py
      - name: Production build
        run: python scripts/build.py
      - name: Installed package smoke test
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install .
          python -m renyyt --version
          renyyt --check
          renyyt >/tmp/renyyt-installed.log 2>&1 & pid=$!
          python - <<'PYSMOKE'
          import json, time, urllib.request
          for _ in range(40):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8787/ready', timeout=.2) as r:
                      data = json.load(r)
                  assert data['status'] == 'ready', data
                  break
              except Exception:
                  time.sleep(.1)
          else:
              raise SystemExit('installed package did not become ready')
          PYSMOKE
          kill -TERM $pid
          wait $pid
      - name: Release package smoke test
        if: matrix.python-version == '3.13'
        run: |
          python scripts/package.py
          python - <<'PYARCHIVE'
          import pathlib, tarfile
          archive = pathlib.Path('renyyt-' + pathlib.Path('VERSION').read_text().strip() + '.tar.gz')
          with tarfile.open(archive) as package:
              names = package.getnames()
          assert 'renyyt/LICENSE' in names
          assert not any(name.endswith('.gz') for name in names)
          PYARCHIVE
      - name: Install reproducible-build tools
        if: matrix.python-version == '3.13'
        run: python -m pip install 'setuptools>=61' wheel
      - name: Reproducible build check
        if: matrix.python-version == '3.13'
        run: python scripts/check_reproducible.py

  quality:
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install Python quality tools
        run: python -m pip install 'coverage>=7.6,<8' 'ruff>=0.8,<1'
      - name: Ruff
        run: ruff check src tests scripts run.py
      - name: Coverage
        run: |
          PYTHONPATH=src coverage run --branch -m unittest discover -s tests -p 'test_*.py'
          coverage report --fail-under=78
      - name: Install JavaScript quality tools
        run: npm install --ignore-scripts --no-package-lock
      - name: ESLint
        run: npm run lint:js
      - name: Frontend unit tests
        run: npm run test:frontend
      - name: JavaScript syntax check
        run: |
          node --check web/helpers.js
          node --check web/app.js
          node --check web/i18n.js
      - name: Install Chromium and Firefox for Playwright
        if: needs.changes.outputs.browser == 'true'
        run: npx playwright install --with-deps chromium firefox
      - name: Playwright end-to-end tests
        if: needs.changes.outputs.browser == 'true'
        run: npm run test:e2e
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures
          path: test-results/
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build container
        run: docker build -t renyyt:test .
      - name: Check container runtime
        run: |
          docker run --rm renyyt:test python3 -c 'import sys; assert sys.version_info[:2] == (3, 13)'
          docker run --rm renyyt:test python3 run.py --check
      - name: Check container readiness and shutdown
        run: |
          container_id=$(docker run -d renyyt:test)
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec "$container_id" python3 -c "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8787/ready', timeout=1)); assert data['status'] == 'ready'" 2>/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs "$container_id"
            exit 1
          fi
          test "$(docker exec "$container_id" id -u)" != 0
          docker stop --timeout 10 "$container_id"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container_id")" = 0

  visual:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install JavaScript test tools
        run: npm install --ignore-scripts --no-package-lock
      - name: Compare Chromium screenshots twice
        run: npm run test:visual -- --repeat-each=2
      - name: Upload visual comparison artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chromium-visual-comparisons
          path: |
            tests/e2e/visual.spec.js-snapshots/
            test-results/
          if-no-files-found: ignore
