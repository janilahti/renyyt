name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.changes.outputs.full }}
      browser: ${{ steps.changes.outputs.browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select documentation, container or full checks
        id: changes
        run: python3 scripts/ci_browser_changes.py >> "$GITHUB_OUTPUT"

  documentation:
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: CI selection regressions
        run: |
          python -m unittest discover -s tests -p 'test_ci_browser_changes.py'
          python -m unittest discover -s tests -p 'test_documentation.py'
      - name: Validate documentation links and examples
        run: python scripts/check_docs.py
      - name: Build and check runtime resources
        run: |
          python scripts/build.py
          python run.py --check

  native-packages:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    uses: ./.github/workflows/native-packages.yml

  package-repositories:
    needs: [changes, native-packages]
    if: needs.changes.outputs.full == 'true'
    uses: ./.github/workflows/package-repository-tests.yml

  python:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Python compile check
        run: python -m compileall -q src scripts deploy/linux run.py
      - name: Production build
        run: python scripts/build.py
      - name: Installed package smoke test
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install .
          python -m renyyt --version
          renyyt --check
          renyyt >/tmp/renyyt-installed.log 2>&1 & pid=$!
          python - <<'PYSMOKE'
          import json, time, urllib.request
          for _ in range(40):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18514/ready', timeout=.2) as r:
                      data = json.load(r)
                  assert data['status'] == 'ready', data
                  with urllib.request.urlopen('http://127.0.0.1:18514/version', timeout=.2) as r:
                      version = json.load(r)
                  assert version['buildTime'] and len(version['gitCommit']) == 40, version
                  break
              except Exception:
                  time.sleep(.1)
          else:
              raise SystemExit('installed package did not become ready')
          PYSMOKE
          kill -TERM $pid
          wait $pid
      - name: Release package smoke test
        if: matrix.python-version == '3.13'
        run: |
          python scripts/package.py --format all
          python - <<'PYARCHIVE'
          import pathlib, tarfile, zipfile, tempfile, subprocess, sys
          archive = pathlib.Path('renyyt-' + pathlib.Path('VERSION').read_text().strip() + '.tar.gz')
          with tarfile.open(archive) as package:
              names = package.getnames()
          assert 'renyyt/LICENSE' in names
          assert not any(name.endswith(('.gz', '.zip')) for name in names)
          with zipfile.ZipFile(archive.with_name(archive.name.replace('.tar.gz', '.zip'))) as zipped:
              assert set(zipped.namelist()) == {name for name in names}
              for language in ('fi', 'en', 'sv', 'uk', 'ar', 'fa', 'vi', 'zh-Hans', 'et'):
                  assert 'renyyt/README.' + language + '.md' in zipped.namelist()
              with tempfile.TemporaryDirectory() as folder:
                  zipped.extractall(folder)
                  root = pathlib.Path(folder) / 'renyyt'
                  subprocess.run([sys.executable, 'run.py', '--check'], cwd=root, check=True)
          PYARCHIVE
      - name: Install reproducible-build tools
        if: matrix.python-version == '3.13'
        run: python -m pip install 'setuptools>=61' wheel
      - name: Reproducible build check
        if: matrix.python-version == '3.13'
        run: python scripts/check_reproducible.py

  quality:
    if: needs.changes.outputs.full == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install Python quality tools
        run: python -m pip install 'coverage>=7.6,<8' 'ruff>=0.8,<1'
      - name: Ruff
        run: ruff check src tests scripts deploy/linux run.py
      - name: Coverage
        run: |
          PYTHONPATH=src coverage run --branch -m unittest discover -s tests -p 'test_*.py'
          coverage report --fail-under=78
      - name: Install JavaScript quality tools
        run: npm install --ignore-scripts --no-package-lock
      - name: ESLint
        run: npm run lint:js
      - name: Frontend unit tests
        run: npm run test:frontend
      - name: JavaScript syntax check
        run: |
          node --check web/helpers.js
          node --check web/app.js
          node --check web/i18n.js
      - name: Install Chromium, Firefox and WebKit for Playwright
        if: needs.changes.outputs.browser == 'true'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Playwright end-to-end tests
        if: needs.changes.outputs.browser == 'true'
        run: npm run test:e2e
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures
          path: test-results/
          if-no-files-found: ignore

  container:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build container
        run: |
          mkdir -p state
          printf 'synthetic runtime data' > state/ci-reminders.sqlite3
          printf 'synthetic runtime data' > state/ci-reminders.sqlite3-wal
          docker build --build-arg VCS_REF="$(git rev-parse HEAD)" --build-arg BUILD_DATE="$(git log -1 --format=%cI)" -t renyyt:test .
      - uses: docker/setup-buildx-action@v4
      - name: Validate OCI export
        run: |
          docker buildx build --platform linux/amd64 --output type=oci,dest=/tmp/renyyt.oci.tar .
          python scripts/check_oci.py /tmp/renyyt.oci.tar
      - name: Check container runtime
        run: |
          docker run --rm renyyt:test python3 -c 'import sys; assert sys.version_info[:2] == (3, 13)'
          docker run --rm renyyt:test python3 run.py --check
          docker run --rm -e PYTHONPATH=/app/src renyyt:test python3 -c "from renyyt.server import BUILD_TIME, GIT_COMMIT; assert BUILD_TIME and len(GIT_COMMIT) == 40"
          docker run --rm renyyt:test python3 -c "from pathlib import Path; assert not list(Path('/app').rglob('ci-reminders.sqlite3*'))"
      - name: Check readiness, custom port/base path and shutdown
        run: |
          for mode in default custom; do
            if [ "$mode" = custom ]; then
              container_id=$(docker run -d -e PORT=18514 -e RENYYT_PORT=8989 -e RENYYT_BASE_PATH=/renyyt renyyt:test)
            else
              container_id=$(docker run -d renyyt:test)
            fi
            trap 'docker rm -f "$container_id" >/dev/null' EXIT
            healthcheck=$(docker inspect --format '{{index .Config.Healthcheck.Test 1}}' "$container_id")
            ready=false
            for attempt in $(seq 1 30); do
              if docker exec "$container_id" /bin/sh -c "$healthcheck" 2>/dev/null; then
                ready=true
                break
              fi
              sleep 1
            done
            if [ "$ready" != true ]; then
              docker logs "$container_id"
              exit 1
            fi
            test "$(docker exec "$container_id" id -u)" != 0
            docker stop --timeout 10 "$container_id"
            test "$(docker inspect --format '{{.State.ExitCode}}' "$container_id")" = 0
            docker rm "$container_id"
            trap - EXIT
          done

  visual:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install JavaScript test tools
        run: npm install --ignore-scripts --no-package-lock
      - name: Compare Chromium screenshots twice
        run: npm run test:visual -- --repeat-each=2
      - name: Upload visual comparison artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chromium-visual-comparisons
          path: |
            tests/e2e/visual.spec.js-snapshots/
            test-results/
          if-no-files-found: ignore
      - name: Upload compact visual images for review
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chromium-visual-images
          path: test-results/**/*.png
          if-no-files-found: ignore
