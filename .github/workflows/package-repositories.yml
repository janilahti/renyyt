name: Publish package repositories

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '43 4 * * 1'

permissions:
  contents: read

concurrency:
  group: package-repositories-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'janilahti/renyyt' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev rpm createrepo-c gnupg
      - name: Verify release assets and build signed repositories
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
        run: python scripts/package_repository.py --output build/pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy package repositories
        id: deployment
        uses: actions/deploy-pages@v5
