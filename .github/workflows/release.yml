name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  native-packages:
    uses: ./.github/workflows/native-packages.yml

  release:
    needs: native-packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify tag matches VERSION
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
      - name: Stable release timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Documentation consistency
        run: python scripts/check_docs.py
      - name: Test
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node tests/test_frontend.js
      - name: Build
        run: python scripts/build.py
      - name: Runtime resource check
        run: python run.py --check
      - name: Package
        run: python scripts/package.py --format all
      - uses: actions/download-artifact@v8
        with:
          name: linux-packages
          path: .
      - name: Release notes and checksums
        run: |
          sha256sum renyyt-*.tar.gz renyyt-*.zip renyyt_*.deb renyyt-*.rpm > /tmp/SHA256SUMS
          python - <<'PYNOTES'
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          notes = Path('CHANGELOG.md').read_text().split('## ' + version + ' ', 1)[1]
          notes = notes.split('\n## ', 1)[0].split('\n', 1)[1].strip()
          Path('/tmp/release-notes.md').write_text(notes + '\n')
          PYNOTES
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" renyyt-*.tar.gz renyyt-*.zip renyyt_*.deb renyyt-*.rpm /tmp/SHA256SUMS --verify-tag --title "Renyyt ${GITHUB_REF_NAME}" --notes-file /tmp/release-notes.md
