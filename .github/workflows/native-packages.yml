name: Native Linux packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y rpm python3-venv
      - name: Build packages and upgrade fixtures reproducibly
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python scripts/package_linux.py --output build/linux
          python scripts/package_linux.py --output build/repeat
          python scripts/package_linux.py --revision 2 --output build/upgrade
          python - <<'PY'
          from pathlib import Path
          for package in Path('build/linux').iterdir():
              assert package.read_bytes() == (Path('build/repeat') / package.name).read_bytes(), package
          PY
      - name: Install optional push dependencies in isolated environment
        run: |
          sudo /usr/bin/python3 -m venv /opt/renyyt/venv
          sudo /opt/renyyt/venv/bin/python -m pip install 'pywebpush>=2.5,<3'
      - name: Real systemd installation and lifecycle on disposable runner
        run: sudo /usr/bin/python3 scripts/test_linux_packages.py --disposable --systemd --push-python /opt/renyyt/venv/bin/python --format deb --packages build/linux --upgrades build/upgrade
      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: build/linux/*
      - uses: actions/upload-artifact@v7
        with:
          name: linux-upgrade-fixtures
          path: build/upgrade/*

  distributions:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            format: deb
          - image: debian:13
            format: deb
          - image: ubuntu:22.04
            format: deb
          - image: ubuntu:24.04
            format: deb
          - image: fedora:44
            format: rpm
          - image: rockylinux:9
            format: rpm
          - image: rockylinux/rockylinux:10
            format: rpm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-packages
          path: build/linux
      - uses: actions/download-artifact@v8
        with:
          name: linux-upgrade-fixtures
          path: build/upgrade
      - name: Install, upgrade, remove and purge inside disposable distribution
        env:
          IMAGE: ${{ matrix.image }}
          FORMAT: ${{ matrix.format }}
        run: |
          docker run --rm -e FORMAT -v "$PWD:/src:ro" -w /src "$IMAGE" /bin/sh -ec '
            if [ "$FORMAT" = deb ]; then
              apt-get update
              apt-get install -y python3
            else
              dnf install -y python3
            fi
            if [ "$FORMAT" = deb ]; then
              candidate=$(apt-cache policy python3-pywebpush | sed -n "s/.*Candidate: //p")
              if [ -n "$candidate" ] && [ "$candidate" != "(none)" ]; then
                apt-get install -y python3-pywebpush
              else
                echo "PUSH_AVAILABILITY: python3-pywebpush unavailable in enabled repositories"
              fi
            else
              if dnf -q list --available python3-pywebpush; then
                dnf install -y python3-pywebpush
              else
                echo "PUSH_AVAILABILITY: python3-pywebpush unavailable in enabled repositories"
              fi
            fi
            python3 scripts/test_linux_packages.py --disposable --format "$FORMAT" --packages build/linux --upgrades build/upgrade
          '
